name: Release

# Doğrulanabilir release: bir sürüm etiketi (v*) push edilince build GitHub'ın kendi
# sunucularında KAYNAKTAN üretilir, SHA-256 toplamları hesaplanır ve installer + portable +
# latest.yml + blockmap + SHA256SUMS.txt + kaynak commit AYNI repo'nun Releases'ine yüklenir.
# Yayın PRE-RELEASE olarak işaretlenir (test edildikten sonra elle "latest" yapılır).

on:
  push:
    tags:
      - 'v*'

# GITHUB_TOKEN'a Release oluşturma izni (ek secret gerekmez).
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies (clean)
        run: npm ci

      - name: Build (electron-vite)
        run: npm run build

      - name: Package (electron-builder — NSIS + portable + latest.yml)
        # --publish never: electron-builder yüklemez; dağıtımı softprops aşağıda yapar.
        # publish provider (github: ibarslan-45/path-of-berkay) app-update.yml'ye gömülür → oto-güncelleme.
        run: npx electron-builder --win --publish never

      - name: Compute SHA-256 checksums
        shell: pwsh
        run: |
          $sums = "release/SHA256SUMS.txt"
          if (Test-Path $sums) { Remove-Item $sums }
          # Yalnız release/ kökündeki dağıtılabilir dosyalar (win-unpacked HARİÇ).
          $files = Get-ChildItem -Path release -File | Where-Object { $_.Extension -eq '.exe' -or $_.Name -eq 'latest.yml' } | Sort-Object Name
          foreach ($f in $files) {
            $h = (Get-FileHash -Algorithm SHA256 -Path $f.FullName).Hash.ToLower()
            Add-Content -Path $sums -Value ("{0}  {1}" -f $h, $f.Name)
          }
          Write-Host "----- SHA256SUMS.txt -----"
          Get-Content $sums

      - name: Write build provenance
        shell: pwsh
        run: |
          $info = "release/BUILD_INFO.txt"
          Set-Content -Path $info -Value "Repository: ${{ github.repository }}"
          Add-Content -Path $info -Value "Tag:        ${{ github.ref_name }}"
          Add-Content -Path $info -Value "Commit:     ${{ github.sha }}"
          Add-Content -Path $info -Value "Runner:     ${{ runner.os }}"
          Add-Content -Path $info -Value "Workflow:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          Get-Content $info

      - name: Create GitHub Release (pre-release)
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          body: |
            Bu build GitHub Actions tarafından **kaynaktan** üretildi (windows-latest: `npm ci` → `npm run build` → `electron-builder`). Üçüncü taraf imzası/yüklemesi yoktur.

            - Kaynak commit: `${{ github.sha }}`
            - Etiket: `${{ github.ref_name }}`
            - Çalıştırma kaydı (loglar): ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            SHA-256 toplamları **SHA256SUMS.txt** olarak ektedir. Kendiniz aynı commit'i çekip `npm run dist` ile derleyerek SHA-256'ları karşılaştırabilirsiniz (bkz. README — "Doğrulanabilir build").

            ---
            This build was produced **from source** by GitHub Actions (no third-party signing/upload). SHA-256 checksums are attached as **SHA256SUMS.txt**; you can reproduce it from the same commit with `npm run dist` and compare.
          files: |
            release/PathOfBerkay-Setup-*.exe
            release/PathOfBerkay-*-portable.exe
            release/latest.yml
            release/*.blockmap
            release/SHA256SUMS.txt
            release/BUILD_INFO.txt
